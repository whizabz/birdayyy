<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const poly = (n, amp, mode) => {
      const pts = [];
      for (let i = 0; i < 96; i++) {
        const t = (i / 96) * Math.PI * 2;
        const r = mode === 'f' ? 0.5 * ((1 - amp) + amp * Math.abs(Math.cos(n * t / 2))) : 0.5 * ((1 - amp) + amp * (1 + Math.cos(n * t)) / 2);
        pts.push((50 + 100 * r * Math.cos(t - Math.PI / 2)).toFixed(1) + '% ' + (50 + 100 * r * Math.sin(t - Math.PI / 2)).toFixed(1) + '%');
      }
      return 'polygon(' + pts.join(',') + ')';
    };
    return { s: { cookie: poly(9, 0.12, 'c'), flower: poly(6, 0.3, 'f') } };
  }
}
</script>
