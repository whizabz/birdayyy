<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Person detail</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700;800;900&display=swap">
<style>
body{margin:0;font-family:'Roboto Flex',system-ui,sans-serif}
.app{--bg:#FFF8F3;--sc:#FBEBE1;--sch:#F3DCCF;--ink:#2A1A18;--ink2:#6B524C;--pri:#BF3A24;--onpri:#fff;--pc:#FFDAD2;--onpc:#4A0E04;--line:rgba(42,26,24,.14);--glass:rgba(255,248,243,.58);--glassb:rgba(255,255,255,.6);--chip:rgba(255,255,255,.6);--t1:#FFDAD2;--t2:#FFE08A;--t3:#EBD0F5;--t4:#BFEBDD;--t5:#FFE08A;--t6:#F5E3D8;--a1:#F2886F;--a2:#F4B93D;--a3:#B98AD6;--a4:#6FC3A5;--a5:#F2886F;--a6:#F4B93D;position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);box-sizing:border-box;font-family:'Roboto Flex',system-ui,sans-serif}
.app *{box-sizing:border-box}
.app h1,.app h2,.app p{margin:0}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);border:1px solid var(--glassb);box-shadow:0 8px 32px rgba(60,20,10,.12)}
.app .blob{position:absolute;filter:blur(3px);opacity:.85;border-radius:0;background-color:transparent;background-repeat:no-repeat;background-image:radial-gradient(circle,var(--a1,#F2886F) 0 50%,transparent 52%),linear-gradient(45deg,transparent 36%,var(--a2,#F4B93D) 36% 64%,transparent 64%),linear-gradient(135deg,var(--a3,#B98AD6) 50%,transparent 50%),radial-gradient(circle,var(--a4,#6FC3A5) 0 50%,transparent 52%),linear-gradient(-45deg,transparent 36%,var(--a1,#F2886F) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a5,#6FB4E8) 38% 62%,transparent 64%),radial-gradient(circle,var(--a6,#EE86AE) 0 50%,transparent 52%),linear-gradient(20deg,transparent 36%,var(--a3,#B98AD6) 36% 64%,transparent 64%),linear-gradient(315deg,var(--a2,#F4B93D) 50%,transparent 50%),radial-gradient(circle,var(--a1,#F2886F) 0 50%,transparent 52%),linear-gradient(-30deg,transparent 36%,var(--a4,#6FC3A5) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a2,#F4B93D) 38% 62%,transparent 64%),linear-gradient(45deg,var(--a5,#6FB4E8) 50%,transparent 50%),radial-gradient(circle,var(--a3,#B98AD6) 0 50%,transparent 52%),linear-gradient(70deg,transparent 36%,var(--a6,#EE86AE) 36% 64%,transparent 64%),radial-gradient(circle,var(--a5,#6FB4E8) 0 50%,transparent 52%),linear-gradient(225deg,var(--a1,#F2886F) 50%,transparent 50%),linear-gradient(100deg,transparent 36%,var(--a2,#F4B93D) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a6,#EE86AE) 38% 62%,transparent 64%),radial-gradient(circle,var(--a4,#6FC3A5) 0 50%,transparent 52%);background-size:12px 12px,22px 22px,16px 16px,10px 10px,20px 20px,18px 18px,11px 11px,24px 24px,18px 18px,9px 9px,22px 22px,16px 16px,16px 16px,12px 12px,20px 20px,9px 9px,14px 14px,26px 26px,14px 14px,8px 8px;background-position:8% 10%,30% 5%,55% 16%,78% 8%,93% 28%,14% 36%,40% 44%,66% 48%,88% 62%,5% 66%,28% 76%,52% 86%,78% 94%,96% 84%,12% 95%,62% 28%,20% 20%,44% 24%,84% 44%,36% 62%}
.a1{background:var(--a1)}.a2{background:var(--a2)}.a3{background:var(--a3)}.a4{background:var(--a4)}.a5{background:var(--a5)}.a6{background:var(--a6)}
.av{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;color:#2A1A18;flex:none}
.ph{background:radial-gradient(circle at 50% 30%,#F6D9C0,#C98F6A)}
.ph::before{content:'';position:absolute;left:34%;top:20%;width:32%;height:32%;border-radius:50%;background:rgba(255,255,255,.55)}
.ph::after{content:'';position:absolute;left:16%;top:58%;width:68%;height:60%;border-radius:50% 50% 0 0;background:rgba(255,255,255,.45)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600;background:var(--chip);color:var(--ink);white-space:nowrap}
.btn{height:56px;border-radius:999px;padding:0 28px;border:0;font:700 16px 'Roboto Flex',system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--pri);color:var(--onpri)}
.row{display:flex;align-items:center;gap:14px}
.iconbtn{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);border:0}
.card{border-radius:28px;background:var(--sc);padding:6px 16px}
.item{display:flex;align-items:center;gap:14px;padding:12px 0}
.item + .item{border-top:1px solid var(--line)}
.ibox{width:44px;height:44px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:var(--pc);color:var(--onpc);flex:none}
.sub{font-size:13px;color:var(--ink2)}
.ttl{font-size:15px;font-weight:700}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-chl" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
<symbol id="i-chr" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19z"/></symbol>
<symbol id="i-cake" viewBox="0 0 24 24"><path d="M4 20h16v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2z M12 12V9 M12 6.5c1-1 1-2 0-3-1 1-1 2 0 3z M4 16.5c2 1.3 3.5 1.3 4 0 .5 1.3 3.5 1.3 4 0 .5 1.3 3.5 1.3 4 0 .3.8 1.2 1 4 0"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
<symbol id="i-bell" viewBox="0 0 24 24"><path d="M6 17v-6a6 6 0 0 1 12 0v6l1.5 2h-15z M10 21h4"/></symbol>
<symbol id="i-merge" viewBox="0 0 24 24"><path d="M6 4v6a6 6 0 0 0 6 6 M18 4v6a6 6 0 0 1-6 6 M12 16v5"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
<symbol id="i-plus"viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7z"/></symbol>
</defs></svg>
<div class="app">
  <div class="blob a2" style="width:340px;height:340px;left:25px;top:-70px"></div>
  <div class="blob a1" style="width:200px;height:200px;right:-60px;top:140px"></div>

  <div style="position:absolute;left:12px;right:12px;top:18px;display:flex;justify-content:space-between;z-index:2">
    <button class="iconbtn glass" aria-label="Back"><svg class="ic" aria-hidden="true"><use href="#i-chl"/></svg></button>
    <button class="iconbtn glass" aria-label="Edit"><svg class="ic" aria-hidden="true"><use href="#i-edit"/></svg></button>
  </div>

  <div style="position:absolute;left:0;right:0;top:56px;display:flex;flex-direction:column;align-items:center;gap:8px">
    <div class="av ph a1" style="width:184px;height:184px;clip-path:{{s.cookie}}"></div>
    <h1 style="font-size:32px;font-weight:900;letter-spacing:-.5px;margin-top:6px">Maya Okafor</h1>
    <div style="display:flex;gap:8px"><span class="chip">Friends</span><span class="chip">Phone + Google</span></div>
  </div>

  <div style="position:absolute;left:16px;right:16px;top:340px;display:flex;flex-direction:column;gap:12px">
    <div class="card">
      <div class="item">
        <div class="ibox" style="background:var(--pri);color:var(--onpri)"><svg class="ic" aria-hidden="true"><use href="#i-cake"/></svg></div>
        <div style="flex:1"><div class="ttl">Birthday</div><div class="sub">10 October · turns 29</div></div>
        <span class="chip" style="background:var(--pri);color:var(--onpri)">Today</span>
      </div>
      <div class="item">
        <div class="ibox" style="background:var(--t2);color:#3D2E00"><svg class="ic" aria-hidden="true"><use href="#i-star"/></svg></div>
        <div style="flex:1"><div class="ttl">Work anniversary</div><div class="sub">3 March · 4 years</div></div>
        <span class="sub">in 5 months</span>
      </div>
      <div class="item">
        <div class="ibox" style="background:var(--t6);color:#4A0E04"><svg class="ic" aria-hidden="true"><use href="#i-heart"/></svg></div>
        <div style="flex:1"><div class="ttl">Biscuit's gotcha day</div><div class="sub">21 June · 3 years</div></div>
        <span class="chip" style="background:var(--t6);color:#4A0E04">Custom</span>
      </div>
      <div class="item" style="color:var(--pri)">
        <div class="ibox" style="background:transparent;border:1.5px dashed var(--pri);color:var(--pri)"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></div>
        <div class="ttl">Add a date</div>
      </div>
    </div>

    <div class="card"><div class="item">
      <div class="ibox"><svg class="ic" aria-hidden="true"><use href="#i-bell"/></svg></div>
      <div style="flex:1"><div class="ttl">Reminders</div><div class="sub">Normal · 7:00 AM</div></div>
      <svg class="ic" style="color:var(--ink2)" aria-hidden="true"><use href="#i-chr"/></svg>
    </div></div>

    <div class="card"><div class="item">
      <div class="ibox"><svg class="ic" aria-hidden="true"><use href="#i-merge"/></svg></div>
      <div style="flex:1"><div class="ttl">Sources</div><div class="sub">Merged from Phone and Google</div></div>
      <span class="chip" style="background:var(--pc);color:var(--onpc)">Move or merge</span>
    </div></div>
  </div>

  <div class="glass" style="position:absolute;left:0;right:0;bottom:0;padding:14px 20px 24px;border-radius:0">
    <button class="btn" style="width:100%">Send a wish to Maya <svg class="ic" style="width:20px;height:20px" aria-hidden="true"><use href="#i-send"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const poly = (n, amp, mode) => {
      const pts = [];
      for (let i = 0; i < 96; i++) {
        const t = (i / 96) * Math.PI * 2;
        const r = mode === 'f' ? 0.5 * ((1 - amp) + amp * Math.abs(Math.cos(n * t / 2))) : 0.5 * ((1 - amp) + amp * (1 + Math.cos(n * t)) / 2);
        pts.push((50 + 100 * r * Math.cos(t - Math.PI / 2)).toFixed(1) + '% ' + (50 + 100 * r * Math.sin(t - Math.PI / 2)).toFixed(1) + '%');
      }
      return 'polygon(' + pts.join(',') + ')';
    };
    return { s: { cookie: poly(9, 0.12, 'c') } };
  }
}
</script>
</body>
</html>
