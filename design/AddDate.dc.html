<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a custom date</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700;800;900&display=swap">
<style>
body{margin:0;font-family:'Roboto Flex',system-ui,sans-serif}
.app{--bg:#FFF8F3;--sc:#FBEBE1;--sch:#F3DCCF;--ink:#2A1A18;--ink2:#6B524C;--pri:#BF3A24;--onpri:#fff;--pc:#FFDAD2;--onpc:#4A0E04;--line:rgba(42,26,24,.14);--glass:rgba(255,248,243,.78);--glassb:rgba(255,255,255,.6);--t2:#FFE08A;--t6:#F5E3D8;--a1:#F2886F;--a2:#F4B93D;--a3:#B98AD6;--a4:#6FC3A5;--a5:#F2886F;--a6:#F4B93D;position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);box-sizing:border-box;font-family:'Roboto Flex',system-ui,sans-serif}
.app *{box-sizing:border-box}
.app h1,.app h2,.app p{margin:0}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);border:1px solid var(--glassb);box-shadow:0 -8px 40px rgba(60,20,10,.18)}
.app .blob{position:absolute;filter:blur(3px);opacity:.85;border-radius:0;background-color:transparent;background-repeat:no-repeat;background-image:radial-gradient(circle,var(--a1,#F2886F) 0 50%,transparent 52%),linear-gradient(45deg,transparent 36%,var(--a2,#F4B93D) 36% 64%,transparent 64%),linear-gradient(135deg,var(--a3,#B98AD6) 50%,transparent 50%),radial-gradient(circle,var(--a4,#6FC3A5) 0 50%,transparent 52%),linear-gradient(-45deg,transparent 36%,var(--a1,#F2886F) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a5,#6FB4E8) 38% 62%,transparent 64%),radial-gradient(circle,var(--a6,#EE86AE) 0 50%,transparent 52%),linear-gradient(20deg,transparent 36%,var(--a3,#B98AD6) 36% 64%,transparent 64%),linear-gradient(315deg,var(--a2,#F4B93D) 50%,transparent 50%),radial-gradient(circle,var(--a1,#F2886F) 0 50%,transparent 52%),linear-gradient(-30deg,transparent 36%,var(--a4,#6FC3A5) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a2,#F4B93D) 38% 62%,transparent 64%),linear-gradient(45deg,var(--a5,#6FB4E8) 50%,transparent 50%),radial-gradient(circle,var(--a3,#B98AD6) 0 50%,transparent 52%),linear-gradient(70deg,transparent 36%,var(--a6,#EE86AE) 36% 64%,transparent 64%),radial-gradient(circle,var(--a5,#6FB4E8) 0 50%,transparent 52%),linear-gradient(225deg,var(--a1,#F2886F) 50%,transparent 50%),linear-gradient(100deg,transparent 36%,var(--a2,#F4B93D) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a6,#EE86AE) 38% 62%,transparent 64%),radial-gradient(circle,var(--a4,#6FC3A5) 0 50%,transparent 52%);background-size:12px 12px,22px 22px,16px 16px,10px 10px,20px 20px,18px 18px,11px 11px,24px 24px,18px 18px,9px 9px,22px 22px,16px 16px,16px 16px,12px 12px,20px 20px,9px 9px,14px 14px,26px 26px,14px 14px,8px 8px;background-position:8% 10%,30% 5%,55% 16%,78% 8%,93% 28%,14% 36%,40% 44%,66% 48%,88% 62%,5% 66%,28% 76%,52% 86%,78% 94%,96% 84%,12% 95%,62% 28%,20% 20%,44% 24%,84% 44%,36% 62%}
.a1{background:var(--a1)}.a2{background:var(--a2)}.a3{background:var(--a3)}.a4{background:var(--a4)}.a5{background:var(--a5)}.a6{background:var(--a6)}
.av{position:relative;overflow:hidden;flex:none}
.ph{background:radial-gradient(circle at 50% 30%,#F6D9C0,#C98F6A)}
.btn{height:52px;border-radius:999px;padding:0 28px;border:0;font:700 16px 'Roboto Flex',system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--pri);color:var(--onpri)}
.btn.text{background:transparent;color:var(--pri)}
.row{display:flex;align-items:center;gap:12px}
.lab{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--ink2)}
.area{border-radius:22px;background:rgba(255,255,255,.75);border-bottom:2px solid var(--pri);padding:12px 16px;font-size:16px;line-height:1.4;font-weight:500}
.ico{width:48px;height:48px;display:flex;align-items:center;justify-content:center;background:var(--sc);color:var(--ink);border-radius:16px}
.ico.on{background:var(--t6);color:#4A0E04;border:2px solid var(--pri)}
.dot{width:32px;height:32px;border-radius:50%}
.dot.on{outline:3px solid var(--pri);outline-offset:2px}
.sw{width:52px;height:32px;border-radius:999px;background:var(--pri);position:relative;flex:none}
.sw::after{content:'';position:absolute;right:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff}
.ttl{font-size:15px;font-weight:700}
.sub{font-size:13px;color:var(--ink2)}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-cake" viewBox="0 0 24 24"><path d="M4 20h16v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2z M12 12V9 M12 6.5c1-1 1-2 0-3-1 1-1 2 0 3z M4 16.5c2 1.3 3.5 1.3 4 0 .5 1.3 3.5 1.3 4 0 .5 1.3 3.5 1.3 4 0 .3.8 1.2 1 4 0"/></symbol>
<symbol id="i-ring" viewBox="0 0 24 24"><path d="M8 3h8l-.6 8.5a3.4 3.4 0 0 1-6.8 0z M12 14.9V20 M8.5 21h7 M10.5 6.5v.01 M13 8.5v.01 M11.5 10.2v.01"/></symbol>
<symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
<symbol id="i-gift" viewBox="0 0 24 24"><path d="M4 11h16v9H4z M3 7h18v4H3z M12 7v13 M12 7C10 3 6 4 7.5 7 M12 7c2-4 6-3 4.5 0"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><path d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M3 19c0-3 2.5-5 6-5s6 2 6 5 M16 6a3 3 0 0 1 0 5.5 M18 14c2 .7 3 2.5 3 5"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 3l2 6 6 2-6 2-2 6-2-6-6-2 6-2z"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z M12 7v5l3 2"/></symbol>
<symbol id="i-cal" viewBox="0 0 24 24"><path d="M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4"/></symbol>
</defs></svg>
<div class="app">
  <div class="blob a2" style="width:300px;height:300px;left:45px;top:-60px"></div>
  <div style="position:absolute;left:0;right:0;top:70px;display:flex;flex-direction:column;align-items:center;gap:8px;opacity:.6">
    <div class="av ph a1" style="width:120px;height:120px;clip-path:{{s.cookie}}"></div>
    <div style="font-size:26px;font-weight:900">Maya Okafor</div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(30,12,8,.45)"></div>

  <div class="glass" style="position:absolute;left:0;right:0;bottom:0;border-radius:36px 36px 0 0;padding:12px 20px 22px;display:flex;flex-direction:column;gap:12px">
    <div style="width:36px;height:5px;border-radius:3px;background:var(--line);align-self:center"></div>
    <h2 style="font-size:24px;font-weight:800;letter-spacing:-.3px">Add a date</h2>

    <div><div class="lab" style="margin-bottom:6px">NAME</div><div class="area">Biscuit's gotcha day</div></div>

    <div class="row" style="gap:10px">
      <div style="flex:1"><div class="lab" style="margin-bottom:6px">DATE</div><div class="area row" style="gap:8px"><svg class="ic" style="width:20px;height:20px;color:var(--ink2)" aria-hidden="true"><use href="#i-cal"/></svg>21 June</div></div>
      <div style="flex:1"><div class="lab" style="margin-bottom:6px">YEAR</div><div class="area" style="color:var(--ink)">2023</div></div>
    </div>

    <div><div class="lab" style="margin-bottom:6px">ICON</div>
      <div class="row" style="gap:8px;justify-content:space-between">
        <div class="ico"><svg class="ic" aria-hidden="true"><use href="#i-cake"/></svg></div>
        <div class="ico"><svg class="ic" aria-hidden="true"><use href="#i-ring"/></svg></div>
        <div class="ico on"><svg class="ic" aria-hidden="true"><use href="#i-heart"/></svg></div>
        <div class="ico"><svg class="ic" aria-hidden="true"><use href="#i-star"/></svg></div>
        <div class="ico"><svg class="ic" aria-hidden="true"><use href="#i-gift"/></svg></div>
        <div class="ico"><svg class="ic" aria-hidden="true"><use href="#i-spark"/></svg></div>
      </div></div>

    <div><div class="lab" style="margin-bottom:8px">TILE COLOR</div>
      <div class="row" style="gap:14px;padding-left:3px"><div class="dot a1"></div><div class="dot a2"></div><div class="dot a3"></div><div class="dot a4"></div><div class="dot a6 on"></div><div class="dot a5"></div></div></div>

    <div class="row" style="justify-content:space-between;background:var(--sc);border-radius:22px;padding:10px 16px"><div><div class="ttl">Repeat every year</div><div class="sub">Remind at 7:00 AM · Normal</div></div><div class="sw" role="img" aria-label="On"></div></div>

    <div class="row" style="justify-content:flex-end;gap:8px"><button class="btn text">Cancel</button><button class="btn">Save date</button></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pts = [];
    for (let i = 0; i < 96; i++) {
      const t = (i / 96) * Math.PI * 2;
      const r = 0.5 * (0.88 + 0.12 * (1 + Math.cos(9 * t)) / 2);
      pts.push((50 + 100 * r * Math.cos(t - Math.PI / 2)).toFixed(1) + '% ' + (50 + 100 * r * Math.sin(t - Math.PI / 2)).toFixed(1) + '%');
    }
    return { s: { cookie: 'polygon(' + pts.join(',') + ')' } };
  }
}
</script>
</body>
</html>
