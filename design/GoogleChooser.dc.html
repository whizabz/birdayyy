<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connect Google</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700;800;900&display=swap">
<style>
body{margin:0;font-family:'Roboto Flex',system-ui,sans-serif}
.app{--bg:#FFF8F3;--sc:#FBEBE1;--sch:#F3DCCF;--ink:#2A1A18;--ink2:#6B524C;--pri:#BF3A24;--onpri:#fff;--pc:#FFDAD2;--onpc:#4A0E04;--line:rgba(42,26,24,.14);--glass:rgba(255,248,243,.72);--glassb:rgba(255,255,255,.6);--chip:rgba(255,255,255,.55);--t1:#FFDAD2;--t2:#FFE08A;--t3:#EBD0F5;--t4:#BFEBDD;--t5:#FFE08A;--t6:#F5E3D8;--a1:#F2886F;--a2:#F4B93D;--a3:#B98AD6;--a4:#6FC3A5;--a5:#F2886F;--a6:#F4B93D;position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);box-sizing:border-box;font-family:'Roboto Flex',system-ui,sans-serif}
.app *{box-sizing:border-box}
.app h1,.app h2,.app p{margin:0}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);border:1px solid var(--glassb);box-shadow:0 -8px 40px rgba(60,20,10,.18)}
.app .blob{position:absolute;filter:blur(3px);opacity:.85;border-radius:0;background-color:transparent;background-repeat:no-repeat;background-image:radial-gradient(circle,var(--a1,#F2886F) 0 50%,transparent 52%),linear-gradient(45deg,transparent 36%,var(--a2,#F4B93D) 36% 64%,transparent 64%),linear-gradient(135deg,var(--a3,#B98AD6) 50%,transparent 50%),radial-gradient(circle,var(--a4,#6FC3A5) 0 50%,transparent 52%),linear-gradient(-45deg,transparent 36%,var(--a1,#F2886F) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a5,#6FB4E8) 38% 62%,transparent 64%),radial-gradient(circle,var(--a6,#EE86AE) 0 50%,transparent 52%),linear-gradient(20deg,transparent 36%,var(--a3,#B98AD6) 36% 64%,transparent 64%),linear-gradient(315deg,var(--a2,#F4B93D) 50%,transparent 50%),radial-gradient(circle,var(--a1,#F2886F) 0 50%,transparent 52%),linear-gradient(-30deg,transparent 36%,var(--a4,#6FC3A5) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a2,#F4B93D) 38% 62%,transparent 64%),linear-gradient(45deg,var(--a5,#6FB4E8) 50%,transparent 50%),radial-gradient(circle,var(--a3,#B98AD6) 0 50%,transparent 52%),linear-gradient(70deg,transparent 36%,var(--a6,#EE86AE) 36% 64%,transparent 64%),radial-gradient(circle,var(--a5,#6FB4E8) 0 50%,transparent 52%),linear-gradient(225deg,var(--a1,#F2886F) 50%,transparent 50%),linear-gradient(100deg,transparent 36%,var(--a2,#F4B93D) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a6,#EE86AE) 38% 62%,transparent 64%),radial-gradient(circle,var(--a4,#6FC3A5) 0 50%,transparent 52%);background-size:12px 12px,22px 22px,16px 16px,10px 10px,20px 20px,18px 18px,11px 11px,24px 24px,18px 18px,9px 9px,22px 22px,16px 16px,16px 16px,12px 12px,20px 20px,9px 9px,14px 14px,26px 26px,14px 14px,8px 8px;background-position:8% 10%,30% 5%,55% 16%,78% 8%,93% 28%,14% 36%,40% 44%,66% 48%,88% 62%,5% 66%,28% 76%,52% 86%,78% 94%,96% 84%,12% 95%,62% 28%,20% 20%,44% 24%,84% 44%,36% 62%}
.a1{background:var(--a1)}.a2{background:var(--a2)}.a3{background:var(--a3)}.a4{background:var(--a4)}.a5{background:var(--a5)}.a6{background:var(--a6)}
.av{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;color:#2A1A18;flex:none}
.btn{height:52px;border-radius:999px;padding:0 28px;border:0;font:700 16px 'Roboto Flex',system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--pri);color:var(--onpri)}
.btn.text{background:transparent;color:var(--pri)}
.row{display:flex;align-items:center;gap:14px}
.acct{border-radius:24px;padding:10px 14px}
.radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--ink2);flex:none}
.radio.on{border-color:var(--pri);background:radial-gradient(circle,var(--pri) 45%,transparent 50%)}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-users" viewBox="0 0 24 24"><path d="M9 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M3 19c0-3 2.5-5 6-5s6 2 6 5 M16 6a3 3 0 0 1 0 5.5 M18 14c2 .7 3 2.5 3 5"/></symbol>
</defs></svg>
<div class="app">
  <div class="blob a2" style="width:260px;height:260px;right:-80px;top:-60px"></div>
  <div style="position:absolute;left:20px;right:20px;top:84px;display:flex;flex-direction:column;gap:12px;opacity:.55">
    <div style="font-size:34px;line-height:1.05;font-weight:800">Where should we look for dates?</div>
    <div style="height:84px;border-radius:28px;background:var(--t2);margin-top:6px"></div>
    <div style="height:84px;border-radius:28px;background:var(--t5)"></div>
    <div style="height:84px;border-radius:28px;background:var(--t3)"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(30,12,8,.45)"></div>

  <div class="glass" style="position:absolute;left:0;right:0;bottom:0;border-radius:36px 36px 0 0;padding:12px 20px 24px;display:flex;flex-direction:column;gap:14px">
    <div style="width:36px;height:5px;border-radius:3px;background:var(--line);align-self:center"></div>
    <div>
      <h2 style="font-size:26px;font-weight:800;letter-spacing:-.3px">Choose an account</h2>
      <p style="font-size:14px;color:var(--ink2);margin-top:2px">to import contacts into Birdayyy</p>
    </div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="acct row" style="background:var(--pc);border:2px solid var(--pri)">
        <div class="av a2" style="width:48px;height:48px;clip-path:{{s.cookie}}">AR</div>
        <div style="flex:1"><div style="font-weight:700;font-size:15px">Alex Rivera</div><div style="font-size:13px;color:var(--ink2)">alex.rivera@gmail.com</div></div>
        <div class="radio on"></div>
      </div>
      <div class="acct row" style="background:var(--sc)">
        <div class="av a5" style="width:48px;height:48px;clip-path:{{s.flower}}">JR</div>
        <div style="flex:1"><div style="font-weight:700;font-size:15px">Jordan Rivera</div><div style="font-size:13px;color:var(--ink2)">jordan.r@work-example.com</div></div>
        <div class="radio"></div>
      </div>
      <div class="acct row" style="background:transparent">
        <div class="av" style="width:48px;height:48px;border-radius:50%;background:var(--sch)"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></div>
        <div style="font-weight:700;font-size:15px">Add another account</div>
      </div>
    </div>
    <div class="row" style="background:var(--sc);border-radius:20px;padding:12px 14px;align-items:flex-start;gap:12px">
      <svg class="ic" style="color:var(--pri)" aria-hidden="true"><use href="#i-users"/></svg>
      <p style="font-size:13px;line-height:1.4;color:var(--ink2)"><b style="color:var(--ink)">Birdayyy will be able to</b> see, add and edit your contacts and their dates. Nothing is deleted without asking.</p>
    </div>
    <div class="row" style="justify-content:flex-end;gap:8px">
      <button class="btn text">Cancel</button>
      <button class="btn">Continue</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const poly = (n, amp, mode) => {
      const pts = [];
      for (let i = 0; i < 96; i++) {
        const t = (i / 96) * Math.PI * 2;
        const r = mode === 'f' ? 0.5 * ((1 - amp) + amp * Math.abs(Math.cos(n * t / 2))) : 0.5 * ((1 - amp) + amp * (1 + Math.cos(n * t)) / 2);
        pts.push((50 + 100 * r * Math.cos(t - Math.PI / 2)).toFixed(1) + '% ' + (50 + 100 * r * Math.sin(t - Math.PI / 2)).toFixed(1) + '%');
      }
      return 'polygon(' + pts.join(',') + ')';
    };
    return { s: { cookie: poly(9, 0.12, 'c'), flower: poly(6, 0.3, 'f') } };
  }
}
</script>
</body>
</html>
