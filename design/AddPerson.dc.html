<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Add a person</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700;800;900&display=swap">
<style>
body{margin:0;font-family:'Roboto Flex',system-ui,sans-serif}
.app{--bg:#FFF8F3;--sc:#FBEBE1;--sch:#F3DCCF;--ink:#2A1A18;--ink2:#6B524C;--pri:#BF3A24;--onpri:#fff;--pc:#FFDAD2;--onpc:#4A0E04;--line:rgba(42,26,24,.14);--glass:rgba(255,248,243,.58);--glassb:rgba(255,255,255,.6);--chip:rgba(255,255,255,.6);--t2:#FFE08A;--t5:#FFE08A;--a1:#F2886F;--a2:#F4B93D;--a3:#B98AD6;--a5:#F2886F;position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);box-sizing:border-box;font-family:'Roboto Flex',system-ui,sans-serif}
.app *{box-sizing:border-box}
.app h1,.app h2,.app p{margin:0}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);border:1px solid var(--glassb);box-shadow:0 8px 32px rgba(60,20,10,.12)}
.app .blob{position:absolute;filter:blur(3px);opacity:.85;border-radius:0;background-color:transparent;background-repeat:no-repeat;background-image:radial-gradient(circle,var(--a1,#F2886F) 0 50%,transparent 52%),linear-gradient(45deg,transparent 36%,var(--a2,#F4B93D) 36% 64%,transparent 64%),linear-gradient(135deg,var(--a3,#B98AD6) 50%,transparent 50%),radial-gradient(circle,var(--a4,#6FC3A5) 0 50%,transparent 52%),linear-gradient(-45deg,transparent 36%,var(--a1,#F2886F) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a5,#6FB4E8) 38% 62%,transparent 64%),radial-gradient(circle,var(--a6,#EE86AE) 0 50%,transparent 52%),linear-gradient(20deg,transparent 36%,var(--a3,#B98AD6) 36% 64%,transparent 64%),linear-gradient(315deg,var(--a2,#F4B93D) 50%,transparent 50%),radial-gradient(circle,var(--a1,#F2886F) 0 50%,transparent 52%),linear-gradient(-30deg,transparent 36%,var(--a4,#6FC3A5) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a2,#F4B93D) 38% 62%,transparent 64%),linear-gradient(45deg,var(--a5,#6FB4E8) 50%,transparent 50%),radial-gradient(circle,var(--a3,#B98AD6) 0 50%,transparent 52%),linear-gradient(70deg,transparent 36%,var(--a6,#EE86AE) 36% 64%,transparent 64%),radial-gradient(circle,var(--a5,#6FB4E8) 0 50%,transparent 52%),linear-gradient(225deg,var(--a1,#F2886F) 50%,transparent 50%),linear-gradient(100deg,transparent 36%,var(--a2,#F4B93D) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a6,#EE86AE) 38% 62%,transparent 64%),radial-gradient(circle,var(--a4,#6FC3A5) 0 50%,transparent 52%);background-size:12px 12px,22px 22px,16px 16px,10px 10px,20px 20px,18px 18px,11px 11px,24px 24px,18px 18px,9px 9px,22px 22px,16px 16px,16px 16px,12px 12px,20px 20px,9px 9px,14px 14px,26px 26px,14px 14px,8px 8px;background-position:8% 10%,30% 5%,55% 16%,78% 8%,93% 28%,14% 36%,40% 44%,66% 48%,88% 62%,5% 66%,28% 76%,52% 86%,78% 94%,96% 84%,12% 95%,62% 28%,20% 20%,44% 24%,84% 44%,36% 62%}
.a1{background:var(--a1)}.a2{background:var(--a2)}.a3{background:var(--a3)}.a5{background:var(--a5)}
.av{position:relative;display:flex;align-items:center;justify-content:center;font-weight:800;color:#2A1A18;flex:none}
.btn{height:56px;border-radius:999px;padding:0 28px;border:0;font:700 16px 'Roboto Flex',system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--pri);color:var(--onpri)}
.row{display:flex;align-items:center;gap:12px}
.iconbtn{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);border:0}
.lab{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--ink2);margin-bottom:6px}
.area{border-radius:22px;background:rgba(255,255,255,.75);border-bottom:2px solid var(--pri);padding:12px 16px;font-size:16px;line-height:1.4;font-weight:500}
.cat{height:36px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;font-size:14px;font-weight:600;background:var(--sc);color:var(--ink2)}
.cat.on{background:var(--pc);color:var(--onpc);border:1.5px solid var(--pri)}
.dest{flex:1;border-radius:20px;padding:10px 6px;background:var(--sc);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:600}
.dest.on{background:var(--pc);border:2px solid var(--pri);padding:8px 4px;color:var(--onpc)}
.badge{width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#2A1A18}
.sub{font-size:12px;line-height:1.35;color:var(--ink2)}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-cake" viewBox="0 0 24 24"><path d="M4 20h16v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2z M12 12V9 M12 6.5c1-1 1-2 0-3-1 1-1 2 0 3z M4 16.5c2 1.3 3.5 1.3 4 0 .5 1.3 3.5 1.3 4 0 .5 1.3 3.5 1.3 4 0 .3.8 1.2 1 4 0"/></symbol>
<symbol id="i-cam" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z M12 17a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z"/></symbol>
<symbol id="i-phone" viewBox="0 0 24 24"><path d="M8 3h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z M11 18h2"/></symbol>
<symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-8A6 6 0 0 1 18 11a3.5 3.5 0 0 1-.5 7z"/></symbol>
</defs></svg>
<div class="app">
  <div class="blob a2" style="width:280px;height:280px;right:-100px;top:-40px"></div>
  <div class="blob a3" style="width:240px;height:240px;left:-100px;top:560px"></div>

  <div style="position:absolute;left:12px;right:16px;top:18px;display:flex;align-items:center;justify-content:space-between">
    <div class="row" style="gap:4px"><button class="iconbtn" aria-label="Close"><svg class="ic" aria-hidden="true"><use href="#i-close"/></svg></button><span style="font-size:22px;font-weight:800">New person</span></div>
  </div>

  <div style="position:absolute;left:20px;right:20px;top:84px;display:flex;flex-direction:column;gap:14px">
    <div class="row" style="gap:16px">
      <div style="position:relative;width:96px;height:96px;flex:none">
        <div class="av a3" style="width:96px;height:96px;clip-path:{{s.flower}};font-size:30px">TL</div>
        <div style="position:absolute;right:-4px;bottom:-4px;width:36px;height:36px;border-radius:12px;background:var(--pri);color:var(--onpri);display:flex;align-items:center;justify-content:center"><svg class="ic" style="width:20px;height:20px" aria-hidden="true"><use href="#i-cam"/></svg></div>
      </div>
      <div style="flex:1"><div class="lab">NAME</div><div class="area">Tessa Lindqvist</div></div>
    </div>

    <div><div class="lab">DATES</div>
      <div class="row" style="gap:8px">
        <div class="area row" style="flex:1;gap:10px"><svg class="ic" style="width:20px;height:20px;color:var(--pri)" aria-hidden="true"><use href="#i-cake"/></svg>Birthday</div>
        <div class="area" style="width:92px">14 Nov</div>
        <div class="area" style="width:74px;color:var(--ink2)">1994</div>
      </div>
      <div class="row" style="gap:6px;margin-top:8px;color:var(--pri);font-weight:700;font-size:14px;padding-left:4px"><svg class="ic" style="width:20px;height:20px" aria-hidden="true"><use href="#i-plus"/></svg>Add another date</div>
    </div>

    <div><div class="lab">CATEGORY</div><div class="row" style="gap:8px"><span class="cat on">Friends</span><span class="cat">Family</span><span class="cat">Colleagues</span></div></div>

    <div><div class="lab">SAVE TO</div>
      <div class="row" style="gap:8px">
        <div class="dest"><div class="av badge a2" style="border-radius:12px"><svg class="ic" style="width:18px;height:18px" aria-hidden="true"><use href="#i-phone"/></svg></div>Phone</div>
        <div class="dest on"><div class="av badge a5" style="border-radius:50%"><svg class="ic" style="width:18px;height:18px" aria-hidden="true"><use href="#i-cloud"/></svg></div>Google</div>
        <div class="dest"><div class="av badge a3" style="border-radius:12px"><svg class="ic" style="width:18px;height:18px" aria-hidden="true"><use href="#i-cloud"/></svg></div>iCloud</div>
      </div>
      <p class="sub" style="margin-top:8px">Creates a contact in alex.rivera@gmail.com. It also appears in your Contacts app and on your other devices.</p>
    </div>
  </div>

  <div class="glass" style="position:absolute;left:0;right:0;bottom:0;padding:14px 20px 24px;border-radius:0">
    <button class="btn" style="width:100%">Save person</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pts = [];
    for (let i = 0; i < 96; i++) {
      const t = (i / 96) * Math.PI * 2;
      const r = 0.5 * (0.7 + 0.3 * Math.abs(Math.cos(3 * t)));
      pts.push((50 + 100 * r * Math.cos(t - Math.PI / 2)).toFixed(1) + '% ' + (50 + 100 * r * Math.sin(t - Math.PI / 2)).toFixed(1) + '%');
    }
    return { s: { flower: 'polygon(' + pts.join(',') + ')' } };
  }
}
</script>
</body>
</html>
