<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Send via any app</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700;800;900&display=swap">
<style>
body{margin:0;font-family:'Roboto Flex',system-ui,sans-serif}
.app{--bg:#FFF8F3;--sc:#FBEBE1;--sch:#F3DCCF;--ink:#2A1A18;--ink2:#6B524C;--pri:#BF3A24;--pc:#FFDAD2;--onpc:#4A0E04;--line:rgba(42,26,24,.14);--glass:rgba(255,248,243,.8);--glassb:rgba(255,255,255,.6);--a1:#F2886F;--a2:#F4B93D;--a3:#B98AD6;--a4:#6FC3A5;--a5:#F2886F;--a6:#F4B93D;position:relative;width:390px;height:844px;overflow:hidden;background:#3a1f1a;color:var(--ink);box-sizing:border-box;font-family:'Roboto Flex',system-ui,sans-serif}
.app *{box-sizing:border-box}
.app h1,.app h2,.app p{margin:0}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:var(--glass);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);border:1px solid var(--glassb);box-shadow:0 -8px 40px rgba(0,0,0,.3)}
.app .blob{position:absolute;filter:blur(3px);opacity:.85;border-radius:0;background-color:transparent;background-repeat:no-repeat;background-image:radial-gradient(circle,var(--a1,#F2886F) 0 50%,transparent 52%),linear-gradient(45deg,transparent 36%,var(--a2,#F4B93D) 36% 64%,transparent 64%),linear-gradient(135deg,var(--a3,#B98AD6) 50%,transparent 50%),radial-gradient(circle,var(--a4,#6FC3A5) 0 50%,transparent 52%),linear-gradient(-45deg,transparent 36%,var(--a1,#F2886F) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a5,#6FB4E8) 38% 62%,transparent 64%),radial-gradient(circle,var(--a6,#EE86AE) 0 50%,transparent 52%),linear-gradient(20deg,transparent 36%,var(--a3,#B98AD6) 36% 64%,transparent 64%),linear-gradient(315deg,var(--a2,#F4B93D) 50%,transparent 50%),radial-gradient(circle,var(--a1,#F2886F) 0 50%,transparent 52%),linear-gradient(-30deg,transparent 36%,var(--a4,#6FC3A5) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a2,#F4B93D) 38% 62%,transparent 64%),linear-gradient(45deg,var(--a5,#6FB4E8) 50%,transparent 50%),radial-gradient(circle,var(--a3,#B98AD6) 0 50%,transparent 52%),linear-gradient(70deg,transparent 36%,var(--a6,#EE86AE) 36% 64%,transparent 64%),radial-gradient(circle,var(--a5,#6FB4E8) 0 50%,transparent 52%),linear-gradient(225deg,var(--a1,#F2886F) 50%,transparent 50%),linear-gradient(100deg,transparent 36%,var(--a2,#F4B93D) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a6,#EE86AE) 38% 62%,transparent 64%),radial-gradient(circle,var(--a4,#6FC3A5) 0 50%,transparent 52%);background-size:12px 12px,22px 22px,16px 16px,10px 10px,20px 20px,18px 18px,11px 11px,24px 24px,18px 18px,9px 9px,22px 22px,16px 16px,16px 16px,12px 12px,20px 20px,9px 9px,14px 14px,26px 26px,14px 14px,8px 8px;background-position:8% 10%,30% 5%,55% 16%,78% 8%,93% 28%,14% 36%,40% 44%,66% 48%,88% 62%,5% 66%,28% 76%,52% 86%,78% 94%,96% 84%,12% 95%,62% 28%,20% 20%,44% 24%,84% 44%,36% 62%}
.a1{background:var(--a1)}.a2{background:var(--a2)}.a3{background:var(--a3)}.a4{background:var(--a4)}.a5{background:var(--a5)}.a6{background:var(--a6)}
.av{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;color:#2A1A18;flex:none}
.ph{background:radial-gradient(circle at 50% 30%,#F6D9C0,#C98F6A)}
.ph::before{content:'';position:absolute;left:34%;top:20%;width:32%;height:32%;border-radius:50%;background:rgba(255,255,255,.55)}
.ph::after{content:'';position:absolute;left:16%;top:58%;width:68%;height:60%;border-radius:50% 50% 0 0;background:rgba(255,255,255,.45)}
.target{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;text-align:center;color:var(--ink)}
.target .o{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;color:#2A1A18}
.lab{font-size:12px;font-weight:700;letter-spacing:.5px;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;background:rgba(255,255,255,.2);color:#fff}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-copy" viewBox="0 0 24 24"><path d="M9 9h11v11H9z M5 15V4h11"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
<symbol id="i-mail" viewBox="0 0 24 24"><path d="M3 6h18v12H3z M3 7l9 7 9-7"/></symbol>
</defs></svg>
<div class="app">
  <div class="blob a1" style="width:300px;height:300px;left:-100px;top:60px"></div>
  <div class="blob a3" style="width:260px;height:260px;right:-90px;top:300px"></div>
  <div style="position:absolute;left:0;right:0;top:120px;display:flex;justify-content:center"><span class="chip">Android share sheet · any app that accepts text</span></div>

  <div class="glass" style="position:absolute;left:0;right:0;bottom:0;border-radius:36px 36px 0 0;padding:12px 20px 26px;display:flex;flex-direction:column;gap:16px">
    <div style="width:36px;height:5px;border-radius:3px;background:var(--line);align-self:center"></div>
    <div style="background:var(--sc);border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;gap:4px">
      <div class="lab">SHARING TEXT</div>
      <div style="font-size:15px;line-height:1.4">Happy birthday, Maya! Hope your day is full of cake and zero emails.</div>
    </div>

    <div class="lab" style="margin-bottom:-6px">SUGGESTED FOR MAYA</div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px">
      <div class="target"><div class="av ph a1" style="width:56px;height:56px;clip-path:{{s.cookie}}"></div>Maya · Messages</div>
      <div class="target"><div class="av ph a1" style="width:56px;height:56px;clip-path:{{s.cookie}}"></div>Maya · WhatsApp</div>
      <div class="target"><div class="av ph a1" style="width:56px;height:56px;clip-path:{{s.cookie}}"></div>Maya · Telegram</div>
      <div class="target"><div class="av ph a1" style="width:56px;height:56px;clip-path:{{s.cookie}}"></div>Maya · Signal</div>
    </div>

    <div class="lab" style="margin-bottom:-6px">APPS</div>
    <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px 10px">
      <div class="target"><div class="o a4">M</div>Messages</div>
      <div class="target"><div class="o a4">W</div>WhatsApp</div>
      <div class="target"><div class="o a5">T</div>Telegram</div>
      <div class="target"><div class="o a5">S</div>Signal</div>
      <div class="target"><div class="o a6">I</div>Instagram</div>
      <div class="target"><div class="o a2"><svg class="ic" aria-hidden="true"><use href="#i-mail"/></svg></div>Email</div>
      <div class="target"><div class="o a3"><svg class="ic" aria-hidden="true"><use href="#i-copy"/></svg></div>Copy</div>
      <div class="target"><div class="o a1"><svg class="ic" aria-hidden="true"><use href="#i-chat"/></svg></div>More</div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const pts = [];
    for (let i = 0; i < 96; i++) {
      const t = (i / 96) * Math.PI * 2;
      const r = 0.5 * (0.88 + 0.12 * (1 + Math.cos(9 * t)) / 2);
      pts.push((50 + 100 * r * Math.cos(t - Math.PI / 2)).toFixed(1) + '% ' + (50 + 100 * r * Math.sin(t - Math.PI / 2)).toFixed(1) + '%');
    }
    return { s: { cookie: 'polygon(' + pts.join(',') + ')' } };
  }
}
</script>
</body>
</html>
