<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home dark with dynamic color</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700;800;900&display=swap">
<style>
body{margin:0;font-family:'Roboto Flex',system-ui,sans-serif}
.app{--bg:#14121C;--sc:#1F1C2B;--sch:#2A2640;--ink:#E8E2FF;--ink2:#BDB6D8;--pri:#CFBDFF;--onpri:#34226E;--pc:#4B3A8A;--onpc:#E8DEFF;--line:rgba(232,226,255,.16);--glass:rgba(31,28,43,.52);--glassb:rgba(255,255,255,.16);--chip:rgba(255,255,255,.14);--t1:#3C3566;--t2:#2F2A4D;--t3:#3C3566;--t4:#2F2A4D;--t5:#2F2A4D;--t6:#3C3566;--a1:#B7A4FF;--a2:#D9C8FF;--a3:#B7A4FF;--a4:#D9C8FF;--a5:#B7A4FF;--a6:#D9C8FF;position:relative;width:390px;height:844px;overflow:hidden;background:var(--bg);color:var(--ink);box-sizing:border-box;font-family:'Roboto Flex',system-ui,sans-serif}
.app *{box-sizing:border-box}
.app h1,.app h2,.app p{margin:0}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);border:1px solid var(--glassb);box-shadow:0 8px 32px rgba(0,0,0,.3)}
.app .blob{position:absolute;filter:blur(3px);opacity:.85;border-radius:0;background-color:transparent;background-repeat:no-repeat;background-image:radial-gradient(circle,var(--a1,#F2886F) 0 50%,transparent 52%),linear-gradient(45deg,transparent 36%,var(--a2,#F4B93D) 36% 64%,transparent 64%),linear-gradient(135deg,var(--a3,#B98AD6) 50%,transparent 50%),radial-gradient(circle,var(--a4,#6FC3A5) 0 50%,transparent 52%),linear-gradient(-45deg,transparent 36%,var(--a1,#F2886F) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a5,#6FB4E8) 38% 62%,transparent 64%),radial-gradient(circle,var(--a6,#EE86AE) 0 50%,transparent 52%),linear-gradient(20deg,transparent 36%,var(--a3,#B98AD6) 36% 64%,transparent 64%),linear-gradient(315deg,var(--a2,#F4B93D) 50%,transparent 50%),radial-gradient(circle,var(--a1,#F2886F) 0 50%,transparent 52%),linear-gradient(-30deg,transparent 36%,var(--a4,#6FC3A5) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a2,#F4B93D) 38% 62%,transparent 64%),linear-gradient(45deg,var(--a5,#6FB4E8) 50%,transparent 50%),radial-gradient(circle,var(--a3,#B98AD6) 0 50%,transparent 52%),linear-gradient(70deg,transparent 36%,var(--a6,#EE86AE) 36% 64%,transparent 64%),radial-gradient(circle,var(--a5,#6FB4E8) 0 50%,transparent 52%),linear-gradient(225deg,var(--a1,#F2886F) 50%,transparent 50%),linear-gradient(100deg,transparent 36%,var(--a2,#F4B93D) 36% 64%,transparent 64%),radial-gradient(circle,transparent 0 36%,var(--a6,#EE86AE) 38% 62%,transparent 64%),radial-gradient(circle,var(--a4,#6FC3A5) 0 50%,transparent 52%);background-size:12px 12px,22px 22px,16px 16px,10px 10px,20px 20px,18px 18px,11px 11px,24px 24px,18px 18px,9px 9px,22px 22px,16px 16px,16px 16px,12px 12px,20px 20px,9px 9px,14px 14px,26px 26px,14px 14px,8px 8px;background-position:8% 10%,30% 5%,55% 16%,78% 8%,93% 28%,14% 36%,40% 44%,66% 48%,88% 62%,5% 66%,28% 76%,52% 86%,78% 94%,96% 84%,12% 95%,62% 28%,20% 20%,44% 24%,84% 44%,36% 62%}
.t1{background:var(--t1)}.t2{background:var(--t2)}.t3{background:var(--t3)}.t4{background:var(--t4)}.t5{background:var(--t5)}.t6{background:var(--t6)}
.a1{background:var(--a1)}.a2{background:var(--a2)}.a3{background:var(--a3)}.a4{background:var(--a4)}.a5{background:var(--a5)}.a6{background:var(--a6)}
.av{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;font-weight:800;color:#1B1630;flex:none}
.ph{background:radial-gradient(circle at 50% 30%,#E9C9B0,#9C6B52)}
.ph::before{content:'';position:absolute;left:34%;top:20%;width:32%;height:32%;border-radius:50%;background:rgba(255,255,255,.5)}
.ph::after{content:'';position:absolute;left:16%;top:58%;width:68%;height:60%;border-radius:50% 50% 0 0;background:rgba(255,255,255,.4)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--chip);color:var(--ink);white-space:nowrap}
.btn{height:40px;border-radius:999px;padding:0 18px;border:0;font:700 14px 'Roboto Flex',system-ui,sans-serif;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--pri);color:var(--onpri)}
.iconbtn{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);border:0;background:transparent}
.tile{border-radius:28px;padding:14px;position:relative;display:flex;flex-direction:column;gap:10px}
.badge{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;background:var(--chip);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.lab{font-size:13px;font-weight:700;letter-spacing:.4px;color:var(--ink2);padding:0 4px}
.navi{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:600;color:var(--ink2)}
.navi .pill{width:56px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.navi.on{color:var(--onpc)}
.navi.on .pill{background:var(--pc)}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--chip)}
.seg span{flex:1;height:36px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;color:var(--ink2);gap:6px}
.seg span.on{background:var(--pc);color:var(--onpc)}
</style>
</helmet>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="i-cake" viewBox="0 0 24 24"><path d="M4 20h16v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2z M12 12V9 M12 6.5c1-1 1-2 0-3-1 1-1 2 0 3z M4 16.5c2 1.3 3.5 1.3 4 0 .5 1.3 3.5 1.3 4 0 .5 1.3 3.5 1.3 4 0 .3.8 1.2 1 4 0"/></symbol>
<symbol id="i-ring" viewBox="0 0 24 24"><path d="M8 3h8l-.6 8.5a3.4 3.4 0 0 1-6.8 0z M12 14.9V20 M8.5 21h7 M10.5 6.5v.01 M13 8.5v.01 M11.5 10.2v.01"/></symbol>
<symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></symbol>
<symbol id="i-search" viewBox="0 0 24 24"><path d="M11 4a7 7 0 1 0 0 14 7 7 0 0 0 0-14z M20 20l-4-4"/></symbol>
<symbol id="i-grid" viewBox="0 0 24 24"><path d="M4 4h7v7H4z M13 4h7v7h-7z M4 13h7v7H4z M13 13h7v7h-7z"/></symbol>
<symbol id="i-chat" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></symbol>
<symbol id="i-tune" viewBox="0 0 24 24"><path d="M4 7h10 M18 7h2 M4 17h2 M10 17h10 M16 5v4 M8 15v4"/></symbol>
<symbol id="i-send" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7z"/></symbol>
<symbol id="i-phone" viewBox="0 0 24 24"><path d="M8 3h8a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z M11 18h2"/></symbol>
<symbol id="i-cloud" viewBox="0 0 24 24"><path d="M7 18a4 4 0 0 1-.6-8A6 6 0 0 1 18 11a3.5 3.5 0 0 1-.5 7z"/></symbol>
</defs></svg>
<div class="app">
  <div class="blob a1" style="width:300px;height:300px;right:-110px;top:80px"></div>
  <div class="blob a3" style="width:260px;height:260px;left:-120px;top:440px"></div>
  <div class="blob a2" style="width:240px;height:240px;right:-80px;top:680px"></div>

  <div style="position:absolute;left:16px;right:16px;top:138px;display:flex;flex-direction:column;gap:10px">
    <div class="lab">TODAY</div>
    <div style="display:flex;gap:12px;align-items:stretch">
      <div class="tile t1" style="flex:1;min-width:0">
        <div class="badge"><svg class="ic" style="width:18px;height:18px" aria-hidden="true"><use href="#i-cake"/></svg></div>
        <div class="av ph a1" style="width:118px;height:118px;clip-path:{{s.cookie}}"></div>
        <div><div style="font-size:19px;font-weight:800">Maya Okafor</div><div style="font-size:13px;color:var(--ink2)">Turns 29</div></div>
        <button class="btn" style="align-self:flex-start">Wish <svg class="ic" style="width:16px;height:16px" aria-hidden="true"><use href="#i-send"/></svg></button>
      </div>
      <div class="tile t3" style="flex:1;min-width:0">
        <div class="badge"><svg class="ic" style="width:18px;height:18px" aria-hidden="true"><use href="#i-ring"/></svg></div>
        <div class="av a3" style="width:118px;height:118px;clip-path:{{s.clover}};font-size:34px">SW</div>
        <div><div style="font-size:19px;font-weight:800">Sam Whitlock</div><div style="font-size:13px;color:var(--ink2)">5th anniversary</div></div>
        <button class="btn" style="align-self:flex-start">Wish <svg class="ic" style="width:16px;height:16px" aria-hidden="true"><use href="#i-send"/></svg></button>
      </div>
    </div>
    <div class="lab" style="margin-top:4px">COMING UP</div>
    <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px">
      <sc-for list="{{rest}}" as="p" hint-placeholder-count="4">
        <div class="tile {{p.t}}" style="flex-direction:row;align-items:center;gap:12px;padding:12px">
          <div class="av {{p.a}}" style="width:60px;height:60px;clip-path:{{p.clip}};border-radius:{{p.br}};font-size:20px">{{p.ini}}</div>
          <div style="min-width:0"><div style="font-size:15px;font-weight:700">{{p.name}}</div><div style="font-size:12px;color:var(--ink2)">{{p.rel}}</div></div>
        </div>
      </sc-for>
    </div>
  </div>

  <div class="glass" style="position:absolute;left:0;right:0;top:0;height:128px;border-radius:0;padding:14px 12px 0 20px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <div style="font-size:28px;font-weight:900;letter-spacing:-.6px">Birdayyy</div>
      <div style="display:flex"><button class="iconbtn" aria-label="Search"><svg class="ic" aria-hidden="true"><use href="#i-search"/></svg></button><button class="iconbtn" aria-label="Settings"><svg class="ic" aria-hidden="true"><use href="#i-tune"/></svg></button></div>
    </div>
    <div class="seg" style="margin:10px 8px 0 0">
      <span class="on"><svg class="ic" style="width:18px;height:18px" aria-hidden="true"><use href="#i-phone"/></svg>Phone</span>
      <span><svg class="ic" style="width:18px;height:18px" aria-hidden="true"><use href="#i-cloud"/></svg>Google</span>
      <span><svg class="ic" style="width:18px;height:18px" aria-hidden="true"><use href="#i-cloud"/></svg>iCloud</span>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const poly = (n, amp, mode) => {
      const pts = [];
      for (let i = 0; i < 96; i++) {
        const t = (i / 96) * Math.PI * 2;
        const r = mode === 'f' ? 0.5 * ((1 - amp) + amp * Math.abs(Math.cos(n * t / 2))) : 0.5 * ((1 - amp) + amp * (1 + Math.cos(n * t)) / 2);
        pts.push((50 + 100 * r * Math.cos(t - Math.PI / 2)).toFixed(1) + '% ' + (50 + 100 * r * Math.sin(t - Math.PI / 2)).toFixed(1) + '%');
      }
      return 'polygon(' + pts.join(',') + ')';
    };
    const S = {
      cookie: { clip: poly(9, 0.12, 'c'), br: '0' },
      flower: { clip: poly(6, 0.3, 'f'), br: '0' },
      clover: { clip: poly(4, 0.34, 'f'), br: '0' },
      sunny: { clip: poly(8, 0.18, 'c'), br: '0' },
      squircle: { clip: 'none', br: '34%' },
      arch: { clip: 'none', br: '50% 50% 18% 18%' }
    };
    const mk = (o) => Object.assign({}, S[o.shape], o);
    return {
      s: { cookie: S.cookie.clip, clover: S.clover.clip },
      rest: [
        mk({ shape: 'flower', name: 'Dev Patel', ini: 'DP', rel: 'Mon 12 Oct', t: 't5', a: 'a5' }),
        mk({ shape: 'arch', name: 'Nana Rose', ini: 'NR', rel: 'Wed 14 Oct', t: 't6', a: 'a6' }),
        mk({ shape: 'cookie', name: 'Jonas Berg', ini: 'JB', rel: 'Thu 15 Oct', t: 't4', a: 'a4' }),
        mk({ shape: 'sunny', name: 'Priya Nair', ini: 'PN', rel: 'Thu 22 Oct', t: 't2', a: 'a2' })
      ]
    };
  }
}
</script>
</body>
</html>
